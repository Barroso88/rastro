services:
  rastro:
    build: .
    container_name: rastro-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-rastro}:${POSTGRES_PASSWORD:-altera-esta-password}@postgres:5432/${POSTGRES_DB:-rastro}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: rastro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rastro}
      POSTGRES_USER: ${POSTGRES_USER:-rastro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-altera-esta-password}
    volumes:
      - rastro_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rastro} -d ${POSTGRES_DB:-rastro}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rastro_pgdata:
